generator.url=http://localhost:8081/generate
generator.timeout=3m

image.folder=/mnt/images/
image.folder.limit=10GB
# every 3 hour
image.folder.limit.cron=0 0 */3 * * *

limit.users=10
limit.requestsByUser=30
# requests of a user who has not polled them for this long are dropped (the player left the game)
limit.idleUser=5m

management.endpoints.web.exposure.include=prometheus